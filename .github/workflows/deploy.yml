name: Deploy to GitHub Pages

# 1. 設定觸發條件：只有當 master 分支有 push 更新時才觸發
on:
  push:
    branches:
      - master
  # 允許你在 GitHub 網頁上手動點擊按鈕觸發（可選）
  workflow_dispatch:

# 2. 賦予 GitHub Actions 部署到 GitHub Pages 的權限
permissions:
  contents: read
  pages: write
  id-token: write

# 3. 避免同時有多個部署在跑時互相衝突
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 第一階段：靜態打包 (Build / Generate)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 安裝相依套件
        run: npm ci

      - name: 產生 Nuxt 靜態網站 (SSG)
        env:
          # 自動把 Base URL 設為 /儲存庫名稱/ (即 /lupa-resume/)
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
        run: npx nuxt generate

      - name: 上傳靜態檔案到 GitHub Pages 暫存區
        uses: actions/upload-pages-artifact@v3
        with:
          # nuxt generate 產生的靜態檔案預設都在 .output/public
          path: ./.output/public

  # 第二階段：正式部署到 GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build # 等待上面的 build 完成後才執行
    steps:
      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4